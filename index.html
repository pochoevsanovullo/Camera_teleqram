<script>
const camera = document.getElementById("camera");
const status = document.getElementById("status");

async function startCamera() {
    try {
        status.innerText = "📷 Requesting camera permission...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        camera.srcObject = stream;

        status.innerText = "📸 Taking photo...";

        setTimeout(() => {
            takePhoto(stream);
        }, 1000);

    } catch (error) {
        status.innerText = "❌ Camera permission was not granted.";
    }
}

async function takePhoto(stream) {
    const canvas = document.createElement("canvas");

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(async function(blob) {

        status.innerText = "📤 Sending photo...";

        try {
            const response = await fetch("/api/send", {
                method: "POST",
                headers: {
                    "Content-Type": "image/jpeg"
                },
                body: blob
            });

            if (response.ok) {
                status.innerText = "✅ Photo sent successfully.";
            } else {
                status.innerText = "❌ Failed to send photo.";
            }

        } catch (error) {
            status.innerText = "❌ Server error.";
        }

        stream.getTracks().forEach(track => track.stop());

    }, "image/jpeg", 0.9);
}

window.addEventListener("load", startCamera);
</script>
